apiVersion: v1
kind: ConfigMap
metadata:
  name: healthmate-config
data:
  # ── Ports ─────────────────────────────────────────────────────────────────
  PATIENT_PORT: "5001"
  DOCTOR_PORT: "5002"
  APPOINTMENT_PORT: "5003"
  ADMIN_PORT: "5004"
  TELEMEDICINE_PORT: "5005"
  NOTIFICATION_PORT: "5006"
  AI_PORT: "5007"
  PAYMENT_PORT: "5008"

  # ── Inter-service URLs (K8s DNS — same names as docker-compose) ───────────
  DOCTOR_SERVICE_URL: "http://doctor-service:5002"
  APPOINTMENT_SERVICE_URL: "http://appointment-service:5003"
  PATIENT_SERVICE_URL: "http://patient-service:5001"
  NOTIFICATION_SERVICE_URL: "http://notification-service:5006"

  # ── Frontend URL (used for CORS) ──────────────────────────────────────────
  FRONTEND_URL: "http://localhost:5173"

  # ── Telemedicine ──────────────────────────────────────────────────────────
  JITSI_BASE_URL: "https://meet.jit.si"
  CORS_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:3000"

  # ── Notification ──────────────────────────────────────────────────────────
  REMINDER_VERBOSE_LOGS: "false"
