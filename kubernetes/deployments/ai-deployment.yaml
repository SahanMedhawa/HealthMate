apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ai-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5007
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: healthmate-config
                  key: AI_PORT
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: healthmate-secrets
                  key: AI_MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: healthmate-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: healthmate-secrets
                  key: GEMINI_API_KEY
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: healthmate-config
                  key: FRONTEND_URL
          readinessProbe:
            tcpSocket:
              port: 5007
            initialDelaySeconds: 15
            periodSeconds: 10
