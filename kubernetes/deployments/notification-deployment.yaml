apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5006
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: healthmate-config
                  key: NOTIFICATION_PORT
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: healthmate-secrets
                  key: NOTIFICATION_MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: healthmate-secrets
                  key: JWT_SECRET
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: healthmate-secrets
                  key: EMAIL_USER
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: healthmate-secrets
                  key: EMAIL_PASS
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: healthmate-secrets
                  key: INTERNAL_API_KEY
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: healthmate-config
                  key: FRONTEND_URL
            - name: APPOINTMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: healthmate-config
                  key: APPOINTMENT_SERVICE_URL
            - name: REMINDER_VERBOSE_LOGS
              valueFrom:
                configMapKeyRef:
                  name: healthmate-config
                  key: REMINDER_VERBOSE_LOGS
          readinessProbe:
            tcpSocket:
              port: 5006
            initialDelaySeconds: 15
            periodSeconds: 10
