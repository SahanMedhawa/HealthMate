apiVersion: v1
kind: Secret
metadata:
  name: healthmate-secrets
type: Opaque
stringData:
  # Shared
  JWT_SECRET: "<shared-jwt-secret>"

  # MongoDB URIs
  PATIENT_MONGO_URI: "<patient-mongo-uri>"
  DOCTOR_MONGO_URI: "<doctor-mongo-uri>"
  APPOINTMENT_MONGO_URI: "<appointment-mongo-uri>"
  ADMIN_MONGO_URI: "<admin-mongo-uri>"
  NOTIFICATION_MONGO_URI: "<notification-mongo-uri>"
  PAYMENT_MONGO_URI: "<payment-mongo-uri>"
  AI_MONGO_URI: "<ai-mongo-uri>"

  # Telemedicine (PostgreSQL)
  DATASOURCE_URL: "<jdbc-postgresql-url>"
  DATASOURCE_USERNAME: "<db-username>"
  DATASOURCE_PASSWORD: "<db-password>"

  # Payment
  STRIPE_SECRET_KEY: "<stripe-secret-key>"

  # AI Service
  GEMINI_API_KEY: "<gemini-api-key>"

  # Notification / Email
  EMAIL_USER: "<smtp-email-user>"
  EMAIL_PASS: "<smtp-email-password-or-app-password>"
  INTERNAL_API_KEY: "<internal-api-key>"
